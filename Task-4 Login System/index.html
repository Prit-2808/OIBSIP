<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Authentication System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="alert-container" class="alert-container">
    <div id="alert-message" class="alert"></div>
  </div>

  <div id="login-view" class="card active">
    <div class="brand">
      <span class="brand-mark">HomeDecor🏠</span>
       <h2>Welcome Back</h2>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="footer-text">Don't have an account? <a onclick="navigateTo('register')">Register here</a></p>
  </div>

  <div id="register-view" class="card">
    <div class="brand">
      <span class="brand-mark">HomeDecor🏠</span>
      <h2>Create Account</h2>
    </div>
    <form id="register-form">
      <div class="form-group">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" required placeholder="Enter a username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" required placeholder="Enter a password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>
        <input type="password" id="register-confirm-password" required placeholder="Re-enter your password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn">Register</button>
    </form>
    <p class="footer-text">Already have an account? <a onclick="navigateTo('login')">Login here</a></p>
  </div>

  <div id="dashboard-view" class="dashboard-fullscreen">
    <div class="dashboard-content">
      <span class="dashboard-icon">HomeDecor🏠</span>
      <h1 id="welcome-message">Welcome, [username]</h1>
      <p class="dashboard-sub">"Transform Your Space, Elevate Your Living — Welcome to HomeDecor."</p>
    </div>
    <button id="logout-btn" class="btn btn-logout">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
